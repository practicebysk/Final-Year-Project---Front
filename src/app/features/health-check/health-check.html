<main class="min-h-screen p-12">
  <h1 class="text-2xl font-semibold">AI Website Builder</h1>
  <p class="text-muted">Setup check</p>
  @if (health(); as h) {
    <p class="mt-4 text-success">Backend: {{ h.status }} · Database: {{ h.database }}</p>
  } @else if (error()) {
    <p class="mt-4 text-danger">{{ error() }}</p>
  } @else {
    <p class="mt-4 text-muted">Checking backend…</p>
  }
</main>
