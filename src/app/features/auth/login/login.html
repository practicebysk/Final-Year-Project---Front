<app-auth-layout title="Welcome back" subtitle="Log in to your account">
  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4" novalidate>
    @if (serverError()) {
      <p class="rounded-lg border border-danger/40 bg-danger/10 px-3 py-2 text-sm text-danger" role="alert">{{ serverError() }}</p>
    }
    <div>
      <app-field label="Email" [error]="err('email', 'Email')">
        <input class="input" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
      </app-field>
    </div>
    <div>
      <app-field label="Password" [error]="err('password', 'Password')">
        <input class="input" type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
      </app-field>
    </div>
    <button type="submit" class="btn btn-primary w-full" [disabled]="loading()">
      {{ loading() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>
  <p class="mt-6 text-center text-sm text-muted">
    No account? <a routerLink="/register" class="text-primary hover:underline">Create one</a>
  </p>
</app-auth-layout>
