<div class="space-y-2 p-3">
  <div class="flex items-center gap-2 text-xs font-medium uppercase tracking-wide text-muted">
    <span class="h-2 w-2 rounded-full bg-success"></span> AI Assistant
  </div>

  @if (busy()) {
    <div class="flex items-center gap-3 rounded-lg border border-primary/40 bg-primary/10 px-3 py-2" role="status" aria-live="polite">
      <span class="h-4 w-4 shrink-0 animate-spin rounded-full border-2 border-primary border-t-transparent"></span>
      <p class="text-sm">Updating your website… <span class="text-xs text-muted">This usually takes 15 to 60 seconds.</span></p>
    </div>
  } @else if (message()) {
    <p class="rounded-lg border px-3 py-2 text-sm"
       [class]="isError() ? 'border-danger/40 bg-danger/10 text-danger' : 'border-border bg-card text-muted'"
       [attr.role]="isError() ? 'alert' : 'status'">{{ message() }}</p>
  }

  <div class="flex gap-2 overflow-x-auto pb-1">
    @for (s of suggestions; track s) {
      <button type="button" [disabled]="busy()"
              class="shrink-0 rounded-full border border-border px-3 py-1 text-xs text-muted hover:border-primary hover:text-fg disabled:opacity-50"
              (click)="prompt.set(s)">{{ s }}</button>
    }
  </div>

  <div class="flex gap-2">
    <input #box class="input" type="text" maxlength="1000" placeholder="What do you want to change?"
           aria-label="Describe the change you want"
           [value]="prompt()" [disabled]="busy()"
           (input)="prompt.set(box.value)" (keydown.enter)="submit()" />
    <button type="button" class="btn btn-primary shrink-0" [disabled]="busy() || !prompt().trim()" (click)="submit()">
      {{ busy() ? 'Working…' : 'Generate' }}
    </button>
  </div>
</div>
