<app-auth-layout title="Create your account" subtitle="Start building websites with AI">
  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4" novalidate>
    @if (serverError()) {
      <p class="rounded-lg border border-danger/40 bg-danger/10 px-3 py-2 text-sm text-danger" role="alert">{{ serverError() }}</p>
    }
    <div>
      <app-field label="Full name" [error]="err('name', 'Name')">
        <input class="input" type="text" formControlName="name" autocomplete="name" placeholder="Your name" />
      </app-field>
    </div>
    <div>
      <app-field label="Email" [error]="err('email', 'Email')">
        <input class="input" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
      </app-field>
    </div>
    <div>
      <app-field label="Password" [error]="err('password', 'Password')">
        <input class="input" type="password" formControlName="password" autocomplete="new-password" placeholder="At least 8 characters" />
      </app-field>
    </div>
    <div>
      <app-field label="Confirm password" [error]="err('confirmPassword', 'Confirm password')">
        <input class="input" type="password" formControlName="confirmPassword" autocomplete="new-password" />
      </app-field>
    </div>
    <button type="submit" class="btn btn-primary w-full" [disabled]="loading()">
      {{ loading() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>
  <p class="mt-6 text-center text-sm text-muted">
    Already registered? <a routerLink="/login" class="text-primary hover:underline">Log in</a>
  </p>
</app-auth-layout>
