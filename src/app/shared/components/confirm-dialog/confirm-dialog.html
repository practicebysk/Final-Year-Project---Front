<div class="fixed inset-0 z-50 grid place-items-center bg-black/60 p-4" (click)="cancelled.emit()">
  <div role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message"
       class="w-full max-w-sm rounded-xl border border-border bg-card p-5 shadow-2xl"
       (click)="$event.stopPropagation()">
    <h2 id="confirm-title" class="text-lg font-semibold">{{ title() }}</h2>
    <p id="confirm-message" class="mt-2 text-sm text-muted">{{ message() }}</p>

    @if (error()) {
      <p class="mt-3 rounded-lg border border-danger/40 bg-danger/10 px-3 py-2 text-sm text-danger" role="alert">{{ error() }}</p>
    }

    <div class="mt-5 flex justify-end gap-2">
      <button #cancelButton type="button" class="btn btn-ghost" [disabled]="busy()" (click)="cancelled.emit()">Cancel</button>
      <button type="button" class="btn bg-danger text-white hover:opacity-90" [disabled]="busy()" (click)="confirmed.emit()">
        {{ busy() ? 'Deleting…' : confirmLabel() }}
      </button>
    </div>
  </div>
</div>
