<header class="flex h-14 items-center gap-3 border-b border-border bg-sidebar px-3 sm:px-5">
  <app-logo />
  <div class="flex min-w-0 flex-1 items-center gap-3"><ng-content /></div>
  <span class="hidden max-w-40 truncate text-sm text-muted md:inline">{{ userName() }}</span>
  <span class="grid h-8 w-8 place-items-center rounded-full bg-card text-xs font-semibold text-muted" aria-hidden="true">{{ initial() }}</span>
  <button type="button" class="btn btn-ghost btn-sm" (click)="logout()">Log out</button>
</header>
